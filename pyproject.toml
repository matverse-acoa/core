[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "acoa-core"
version = "1.0.0b0"
description = "Implementação principal do Adaptive Coherence-Oriented Audit (ACOA)"
authors = [
  { name = "Mateus Alves Arêas", email = "xmatverse@proton.me" }
]
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
  "numpy>=1.23",
  "scipy>=1.11",
]

[project.optional-dependencies]
dev = ["pytest", "black", "flake8", "mypy", "safety", "numpy>=1.23", "scipy>=1.11"]

[tool.black]
line-length = 88
target-version = ["py311"]
include = '\.pyi?$'
