services:
  rb_gate:
    image: python:3.11-slim
    working_dir: /app
    volumes:
      - ./:/app
    command: >
      sh -lc "pip install --no-cache-dir fastapi uvicorn pydantic requests &&
              uvicorn rb_gate:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    restart: "no"

  rb_worker:
    image: python:3.11-slim
    working_dir: /app
    depends_on:
      - rb_gate
    volumes:
      - ./:/app
    command: >
      sh -lc "pip install --no-cache-dir requests &&
              python rb_worker_ome1.py"
    restart: "no"
