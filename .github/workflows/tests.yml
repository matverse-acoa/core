name: tests
on:
  push:
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  pull_request:
    paths-ignore:
      - "**/*.md"
      - "docs/**"

jobs:
  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Early exit for docs-only changes
        run: |
          chmod +x scripts/skip_if_docs_only.sh
          ./scripts/skip_if_docs_only.sh

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          if [ -f core/requirements/base.txt ]; then pip install -r core/requirements/base.txt; fi
          pip install -U pytest black flake8 mypy numpy scipy pydantic

      - name: Format check (black)
        run: |
          black --check .

      - name: Lint (flake8)
        run: |
          flake8 src

      - name: Type check (mypy)
        run: |
          mypy src/acoa/metrics/viability.py src/acoa/metrics/coherence.py src/acoa/metrics/antifragility.py src/acoa/core/autopoiesis.py

      - name: Run tests
        run: |
          pytest -q
